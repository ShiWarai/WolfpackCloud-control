# Локально: cp api-secret-staging.example.yaml api-secret-staging.yaml
# Пароль в DATABASE_URL = пароль из control-infra-secrets-staging.yaml
apiVersion: v1
kind: Secret
metadata:
  name: control-api-env
  namespace: wolfpackcloud-control-staging
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://wolfpack_control_staging:CHANGE_ME_STAGING_POSTGRES_PASSWORD@postgres:5432/wolfpack_control_staging"
  KEYCLOAK_ISSUER: "https://auth.wolfpack.robotics-rtuitlab.ru/realms/wolfpack-control-staging"
  KEYCLOAK_JWKS_URL: "https://auth.wolfpack.robotics-rtuitlab.ru/realms/wolfpack-control-staging/protocol/openid-connect/certs"
  KEYCLOAK_AUDIENCE: "wolfpack-control-web"
  ROSOUT_INGEST_TOKEN: "CHANGE_ME_STAGING_INGEST_TOKEN"
  K8S_NAMESPACE: "wolfpackcloud-zenoh"
  K8S_RESOURCE_POOL_ROLE_VALUES: "worker,dev"
  INFLUXDB_URL: "http://wolfpackcloud-influxdb.wolfpackcloud-control.svc.cluster.local:8086"
  INFLUXDB_ORG: "wolfpackcloud_influxdb"
  INFLUXDB_TOKEN: "CHANGE_ME_INFLUXDB_ADMIN_TOKEN"
  INFLUXDB_BUCKET_ROS_LOGS: "ros_logs"
  INFLUXDB_BUCKET_DEPLOYMENT_EVENTS: "deployment_events"
