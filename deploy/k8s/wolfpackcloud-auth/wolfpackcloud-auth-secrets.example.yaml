# Локально: cp wolfpackcloud-auth-secrets.example.yaml wolfpackcloud-auth-secrets.yaml
# admin-password — вход в https://auth…/admin (bootstrap admin).
# Не путать с паролями пользователей realm wolfpack-control (их задаёте в консоли Keycloak).
apiVersion: v1
kind: Secret
metadata:
  name: wolfpackcloud-auth-db-secret
  namespace: wolfpackcloud-auth
type: Opaque
stringData:
  username: wolfpack
  password: CHANGE_ME_KEYCLOAK_POSTGRES_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: wolfpackcloud-auth-admin-secret
  namespace: wolfpackcloud-auth
type: Opaque
stringData:
  admin-password: CHANGE_ME_KEYCLOAK_ADMIN_BOOTSTRAP_PASSWORD
