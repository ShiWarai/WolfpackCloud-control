apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Перед apply: kubectl apply -f wolfpackcloud-auth-secrets.yaml (из wolfpackcloud-auth-secrets.example.yaml).
namespace: wolfpackcloud-auth

configMapGenerator:
  - name: wolfpackcloud-auth-realm-import
    options:
      disableNameSuffixHash: true
    files:
      - wolfpack-control-realm.json
      - wolfpack-control-realm-staging.json

resources:
  - namespace.yaml
  - traefik-serverstransport.yaml
  - wolfpackcloud-auth-stack.yaml
