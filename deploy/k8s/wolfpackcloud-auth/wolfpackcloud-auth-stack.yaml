# Секреты: см. wolfpackcloud-auth-secrets.example.yaml → wolfpackcloud-auth-secrets.yaml (.gitignore), kubectl apply -f wolfpackcloud-auth-secrets.yaml перед kustomize.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-postgres-pvc
  namespace: wolfpackcloud-auth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-wolfpackcloud-auth
  namespace: wolfpackcloud-auth
  labels:
    app.kubernetes.io/name: postgres-wolfpackcloud-auth
    app.kubernetes.io/part-of: wolfpackcloud-auth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-wolfpackcloud-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-wolfpackcloud-auth
        app.kubernetes.io/part-of: wolfpackcloud-auth
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
                  - key: wolfpack.io/role
                    operator: In
                    values: ["worker"]
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: wolfpackcloud-auth-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wolfpackcloud-auth-db-secret
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: keycloak-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-wolfpackcloud-auth
  namespace: wolfpackcloud-auth
  labels:
    app.kubernetes.io/part-of: wolfpackcloud-auth
spec:
  selector:
    app.kubernetes.io/name: postgres-wolfpackcloud-auth
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wolfpackcloud-auth
  namespace: wolfpackcloud-auth
  labels:
    app.kubernetes.io/name: wolfpackcloud-auth
    app.kubernetes.io/part-of: wolfpackcloud-auth
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: wolfpackcloud-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wolfpackcloud-auth
        app.kubernetes.io/part-of: wolfpackcloud-auth
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
                  - key: wolfpack.io/role
                    operator: In
                    values: ["worker"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["wolfpackcloud-auth"]
              topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 180
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 180
      terminationGracePeriodSeconds: 60
      volumes:
        - name: realm-import
          configMap:
            name: wolfpackcloud-auth-realm-import
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start
            - --import-realm
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wolfpackcloud-auth-admin-secret
                  key: admin-password
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres-wolfpackcloud-auth:5432/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wolfpackcloud-auth-db-secret
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wolfpackcloud-auth-db-secret
                  key: password
            - name: KC_HOSTNAME
              value: https://auth.wolfpack.robotics-rtuitlab.ru
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: JAVA_OPTS_KC_HEAP
              value: -XX:MinRAMPercentage=40 -XX:MaxRAMPercentage=70
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wolfpackcloud-auth
  namespace: wolfpackcloud-auth
  labels:
    app.kubernetes.io/part-of: wolfpackcloud-auth
spec:
  selector:
    app.kubernetes.io/name: wolfpackcloud-auth
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wolfpackcloud-auth-public
  namespace: wolfpackcloud-auth
  labels:
    app.kubernetes.io/part-of: wolfpackcloud-auth
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Длинные ответы Keycloak на ARM (ServersTransport CRD в этом namespace).
    traefik.ingress.kubernetes.io/service.serverstransport: wolfpackcloud-auth-backend@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.wolfpack.robotics-rtuitlab.ru
      secretName: tls-auth-wolfpack-robotics-rtuitlab-ru
  rules:
    - host: auth.wolfpack.robotics-rtuitlab.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wolfpackcloud-auth
                port:
                  number: 8080
