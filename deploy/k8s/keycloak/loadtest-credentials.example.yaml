# Локально: cp loadtest-credentials.example.yaml loadtest-credentials.yaml, задайте пароль, kubectl apply -f loadtest-credentials.yaml
# Используется scripts/keycloak-seed-staging-users.sh и loadtests/run-load-staging.sh
apiVersion: v1
kind: Secret
metadata:
  name: loadtest-credentials
  namespace: wolfpackcloud-control-staging
type: Opaque
stringData:
  username: loadtest-admin
  password: CHANGE_ME_STAGING_LOADTEST_PASSWORD
  user-username: loadtest-user
  user-password: CHANGE_ME_STAGING_LOADTEST_USER_PASSWORD
  keycloak-realm: wolfpack-control-staging
  keycloak-issuer: "https://auth.wolfpack.robotics-rtuitlab.ru/realms/wolfpack-control-staging"
