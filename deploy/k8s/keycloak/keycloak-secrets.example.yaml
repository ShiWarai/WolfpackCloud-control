# Локально: cp keycloak-secrets.example.yaml keycloak-secrets.yaml
# admin-password — вход в https://auth…/admin (bootstrap admin).
# Не путать с паролями пользователей realm wolfpack-control (их задаёте в консоли Keycloak).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: wolfpackcloud-auth
type: Opaque
stringData:
  username: wolfpack
  password: CHANGE_ME_KEYCLOAK_POSTGRES_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
  namespace: wolfpackcloud-auth
type: Opaque
stringData:
  admin-password: CHANGE_ME_KEYCLOAK_ADMIN_BOOTSTRAP_PASSWORD
