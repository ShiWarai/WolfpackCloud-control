# Локальная копия (не коммитить): cp influxdb-secrets.example.yaml influxdb-secrets.yaml
# Тот же token пропишите в control-api-env (INFLUXDB_TOKEN).
apiVersion: v1
kind: Secret
metadata:
  name: wolfpackcloud-influxdb-secret
  namespace: wolfpackcloud-control
type: Opaque
stringData:
  admin-user: admin
  admin-password: CHANGE_ME_INFLUXDB_ADMIN_PASSWORD
  admin-token: CHANGE_ME_INFLUXDB_ADMIN_TOKEN_MIN_32_CHARS
