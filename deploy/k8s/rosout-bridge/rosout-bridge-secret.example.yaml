# Локально: cp rosout-bridge-secret.example.yaml rosout-bridge-secret.yaml (значение = ROSOUT_INGEST_TOKEN в api-secret.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: rosout-bridge-secret
  namespace: wolfpackcloud-zenoh
type: Opaque
stringData:
  ingest-token: CHANGE_ME_MATCH_API_ROSOUT_INGEST_TOKEN
  # Тот же token, что INFLUXDB_TOKEN у control-api (wolfpackcloud-influxdb-secret admin-token)
  influxdb-token: CHANGE_ME_INFLUXDB_ADMIN_TOKEN_MIN_32_CHARS
