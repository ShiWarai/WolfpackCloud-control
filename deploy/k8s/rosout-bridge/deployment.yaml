apiVersion: apps/v1
kind: Deployment
metadata:
  name: rosout-bridge
  namespace: wolfpackcloud-zenoh
  labels:
    app.kubernetes.io/name: rosout-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rosout-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rosout-bridge
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: wolfpack.io/role
                    operator: In
                    values: ["worker"]
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["orangepi5-water-melon"]
      containers:
        - name: bridge
          image: 10.43.50.10:5000/wolfpack-rosout-bridge:latest-arm64
          imagePullPolicy: Always
          env:
            - name: RMW_IMPLEMENTATION
              value: rmw_zenoh_cpp
            - name: ROS_DOMAIN_ID
              value: "0"
            - name: ZENOH_CONFIG_OVERRIDE
              value: >-
                mode="client";connect/endpoints=["tcp/zenoh-router.wolfpackcloud-zenoh.svc.cluster.local:7447"];timestamping/enabled={router:false,peer:false,client:false}
            - name: CONTROL_API_INGEST_URL
              value: http://control-api.wolfpackcloud-control.svc.cluster.local:8000/api/internal/rosout/one
            - name: ROSOUT_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rosout-bridge-secret
                  key: ingest-token
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
