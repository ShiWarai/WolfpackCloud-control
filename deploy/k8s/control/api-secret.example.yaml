# Локальная копия (не коммитить): cp api-secret.example.yaml api-secret.yaml
# Пароль в DATABASE_URL = пароль из control-infra-secrets.yaml (Postgres приложения).
# ROSOUT_INGEST_TOKEN = ingest-token из rosout-bridge-secret.yaml.
# Опционально: CONTROL_ADMIN_USERNAMES в stringData — через запятую preferred_username или email (явные операторы-admin для API).
# Прочие K8S_* (control-plane, исключение master, optional label для dev-нод): см. env.vars.reference.
apiVersion: v1
kind: Secret
metadata:
  name: control-api-env
  namespace: wolfpackcloud-control
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://wolfpack_control:CHANGE_ME_DB_PASSWORD@postgres:5432/wolfpack_control"
  KEYCLOAK_ISSUER: "https://auth.wolfpack.robotics-rtuitlab.ru/realms/wolfpack-control"
  KEYCLOAK_JWKS_URL: "https://auth.wolfpack.robotics-rtuitlab.ru/realms/wolfpack-control/protocol/openid-connect/certs"
  KEYCLOAK_AUDIENCE: "wolfpack-control-web"
  ROSOUT_INGEST_TOKEN: "CHANGE_ME_LONG_RANDOM_INGEST_TOKEN"
  K8S_NAMESPACE: "wolfpackcloud-zenoh"
  # worker + dev в одном пуле UI; master/control-plane скрываются настройками API по умолчанию
  K8S_RESOURCE_POOL_ROLE_VALUES: "worker,dev"
