apiVersion: v1
kind: Service
metadata:
  name: control-api
  namespace: wolfpackcloud-control
spec:
  selector:
    app.kubernetes.io/name: control-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  namespace: wolfpackcloud-control
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: control-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["arm64"]
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - orangepi5-abandon-alien
                      - orangepi5-water-melon
      serviceAccountName: control-api
      containers:
        - name: api
          image: 10.43.50.10:5000/wolfpack-control-api:latest-arm64
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: UVICORN_WORKERS
              value: "10"
          envFrom:
            - secretRef:
                name: control-api-env
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "1500m"
              memory: 1Gi
