# Локально: cp control-infra-secrets.example.yaml control-infra-secrets.yaml, задать пароль, kubectl apply -f control-infra-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: control-postgres-secret
  namespace: wolfpackcloud-control
type: Opaque
stringData:
  username: wolfpack_control
  password: CHANGE_ME_CONTROL_POSTGRES_PASSWORD
